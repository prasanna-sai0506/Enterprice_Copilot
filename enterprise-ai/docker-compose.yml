services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: enterpriseai
      POSTGRES_USER: ent
      POSTGRES_PASSWORD: entpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ent:entpass@postgres/enterpriseai
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/app/chroma_data
      - ./uploads:/app/uploads
volumes:
  postgres_data:
